[project]
name = "support-triage"
version = "0.1.0"
description = "Support ticket routing and KB question answering — ML practical exercise"
requires-python = ">=3.10"
dependencies = [
    "scikit-learn>=1.4",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# OCR is only needed to re-run Part C from raw images; cached OCR text is
# committed so the repo works without it.
ocr = ["rapidocr-onnxruntime>=1.3"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
# Plain scripts run with `python -m triage.*` from the repo root; nothing to build.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
